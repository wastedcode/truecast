name: ci
on:
  push:
  pull_request:

# Least privilege: CI only reads the repo (checkout). No write scopes for the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The installer plugin is shell, so biome can't see it. shellcheck is preinstalled on
      # ubuntu-latest; the guard keeps this honest (and skipped, not silently passing) if that changes.
      - name: shellcheck the installer script
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=style plugin/truecast/bin/*.sh
          else
            echo "::warning::shellcheck not available on this runner — the installer script was NOT linted"
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=high
        continue-on-error: true
